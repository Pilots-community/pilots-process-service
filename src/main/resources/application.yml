spring:
  datasource:
    url: jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

flowable:
  database-schema-update: true
  async-executor-activate: true
  # Disable engines we are not using to reduce startup overhead
  dmn:
    enabled: false
  cmmn:
    enabled: false
  app:
    enabled: false
  form:
    enabled: false
  content:
    enabled: false
  idm:
    enabled: false

server:
  port: 8080
