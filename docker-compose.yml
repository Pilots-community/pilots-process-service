# Two pilots-process-service instances and two frontend UIs — one per dataspace participant.
#
# Process services join the pilots-dataspace Docker network so the EDC
# data-plane containers can reach them by hostname:
#   http://p1-process-service:8080/serviceInstances
#   http://p2-process-service:8080/serviceInstances
#
# Frontends are nginx containers that serve the React UI to the browser.
# The browser makes API calls directly to localhost:8080 / localhost:8081,
# so the frontend containers do NOT need to join the dataspace network.
#
# Usage: see start-local.sh
# Override the Docker network:  DATASPACE_NETWORK=my-network docker compose up -d

services:

  p1-process-service:
    build: .
    container_name: p1-process-service
    ports:
      - "8080:8080"
    networks:
      - dataspace

  p2-process-service:
    build: .
    container_name: p2-process-service
    ports:
      - "8081:8080"
    networks:
      - dataspace

  p1-frontend:
    build:
      context: ../pilots-client-app/frontend
    container_name: p1-frontend
    ports:
      - "3002:80"
    environment:
      API_BASE_URL: "http://localhost:8080"
      SERVICE_DEFINITION: "certiweightVGMProcess"
      ALLOW_BOOKING: "false"
      OWN_DID: "did:web:participant-1-identityhub%3A7093"
      COUNTERPARTY_DID: "did:web:participant-2-identityhub%3A7083"

  p2-frontend:
    build:
      context: ../pilots-client-app/frontend
    container_name: p2-frontend
    ports:
      - "3003:80"
    environment:
      API_BASE_URL: "http://localhost:8081"
      SERVICE_DEFINITION: "shipperProcess"
      OWN_DID: "did:web:participant-2-identityhub%3A7083"
      COUNTERPARTY_DID: "did:web:participant-1-identityhub%3A7093"

networks:
  dataspace:
    external: true
    name: ${DATASPACE_NETWORK:-pilots-dataspace_default}
